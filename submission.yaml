submission:
  title: "TICAP — Threat Intelligence Correlation & Alert Prioritisation"

  problem_statement: >
    Defence analysts receive thousands of alerts every day from different
    sources such as SIEM systems, satellite feeds, cyber sensors, and
    intelligence reports. These alerts arrive in different formats, making
    it difficult to correlate related events, identify genuine threats,
    and reduce the impact of false positives.

  solution_summary: >
    TICAP provides a unified threat intelligence workflow that processes
    heterogeneous alerts, normalises and correlates related events,
    prioritises potential threats, and maps relevant activity to the
    MITRE ATT&CK framework. It also generates BLUF (Bottom Line Up Front)
    intelligence reports so analysts and commanders can quickly understand
    the most important threat information.

  key_features:
    - "Multi-source threat feed ingestion using JSON, CSV, CEF, and TXT demonstration data"
    - "30-minute rolling-window correlation of related security and intelligence events"
    - "False Positive Probability (FPP) scoring and false-positive prioritisation"
    - "Threat confidence scoring and critical/high/medium alert triage"
    - "MITRE ATT&CK Enterprise v15 threat mapping"
    - "Threat cluster visualisation and correlation analysis"
    - "BLUF (Bottom Line Up Front) intelligence report generation"
    - "Analyst command workflow including /threat-run, /threat-triage, and /mitre"
